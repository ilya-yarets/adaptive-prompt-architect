name: Bug report
description: Report reproducible skill behavior or packaging problems
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include secrets, private transcripts, or personal workspace data. Use synthetic or redacted examples.
  - type: input
    id: host
    attributes:
      label: Host and version
      placeholder: Codex app, Codex CLI, or another compatible host
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Skill version or commit
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Synthetic or redacted example
      description: Include the invocation and only the context needed to reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: checkboxes
    id: security
    attributes:
      label: Security check
      options:
        - label: This report does not contain a suspected vulnerability; security issues are reported privately through SECURITY.md.
          required: true
